name: פרסום האתר

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: מספר גרסה
        run: |
          N=$(( ${{ github.run_number }} - 1 ))
          echo "window.APP_VERSION='$(( 1 + N / 100 )).$(( (N / 10) % 10 )).$(( N % 10 )) (אתר)';" > www/version.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deployment
        uses: actions/deploy-pages@v4
