name: בניית APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: התקנת רכיבים
        run: npm install

      - name: יצירת פרויקט אנדרואיד
        run: npx cap add android

      - name: אייקון לאפליקציה
        continue-on-error: true
        run: npx @capacitor/assets generate --android --iconBackgroundColor "#1E5A4C" --splashBackgroundColor "#F2F4F0"

      - name: סנכרון קבצי האפליקציה
        run: npx cap sync android

      - name: מפתח חתימה קבוע (כדי שעדכונים יותקנו על הגרסה הקודמת)
        run: |
          mkdir -p ~/.android
          cp keys/debug.keystore ~/.android/debug.keystore

      - name: בניית APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: שינוי שם הקובץ
        run: cp android/app/build/outputs/apk/debug/app-debug.apk pinkas-tachzuka.apk

      - uses: actions/upload-artifact@v4
        with:
          name: pinkas-tachzuka-apk
          path: pinkas-tachzuka.apk
